# Builds the Windows installer and publishes it as a GitHub Release.
# Runs on a version tag (git tag v1.0.1 && git push --tags) or by hand (Actions > Windows installer > Run).
# Release assets: HarfOCR-Setup-<version>.exe (the program with Tesseract and PaddleOCR) and the optional
# readers the installer downloads when chosen (HarfOCR-part-heavy.zip, HarfOCR-part-models.zip).
# The installed program checks this repository's latest release at start and offers the update.
name: Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.0.1"
        required: true

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "${{ inputs.version }}" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "heavy=$((Get-Content desktop/HEAVY_VERSION).Trim())" >> $env:GITHUB_OUTPUT

      # what's new: the tag's message without its first line (git tag -a v1.0.3 -m "Harf OCR 1.0.3" -m "- ..."),
      # read in bash so the Arabic passes through as bytes; checkout leaves the tag object behind, so fetch it
      - name: What's new
        id: notes
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            git fetch --quiet --force origin "+refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
            notes=$(git for-each-ref "refs/tags/${{ github.ref_name }}" --format='%(contents:body)')
          fi
          { echo "notes<<END_OF_NOTES"; echo "${notes:-}"; echo "END_OF_NOTES"; } >> "$GITHUB_OUTPUT"

      - name: Tesseract (the UB Mannheim build, copied into the program)
        run: choco install tesseract -y --no-progress

      - name: Program folder and optional readers
        shell: pwsh
        run: ./desktop/build.ps1 -Version "${{ steps.v.outputs.version }}" -Parts

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          # Arabic is one of Inno Setup's official translations now, but older installs lack it; pinned to a commit
          Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/625730370968d1b82a6925f3ac3d671b5aeafb57/Files/Languages/Arabic.isl" -OutFile desktop/Arabic.isl
          & $iscc "/DAppVersion=${{ steps.v.outputs.version }}" "/DHeavyVersion=${{ steps.v.outputs.heavy }}" desktop/installer.iss
          if ($LASTEXITCODE) { throw "installer" }
          Get-ChildItem build/out | Format-Table Name, Length

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Harf OCR ${{ steps.v.outputs.version }}
          make_latest: true
          files: |
            build/out/HarfOCR-Setup-*.exe
            build/out/HarfOCR-part-*.zip
          # the program shows what is between the whats-new markers (server/updater.py NOTES)
          body: |
            <!-- whats-new -->
            ${{ steps.notes.outputs.notes }}
            <!-- /whats-new -->

            Download **HarfOCR-Setup-${{ steps.v.outputs.version }}.exe** and run it (Windows 10 or 11, 64-bit; no administrator rights needed).
            Setup asks whether to add the Nuqta and EasyOCR readers (about 2 GB, downloaded from this release only when chosen).
            An installed copy finds this release at start and offers to update itself.

            [Code signing policy](https://github.com/${{ github.repository }}#code-signing-policy)
